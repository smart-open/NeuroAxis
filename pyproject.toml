[project]
name = "plcagent"
version = "0.1.0"
description = "NeuroAxis: PLC development, simulation, verification and knowledge platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
infra = ["psycopg[binary]>=3.1", "redis>=5", "boto3>=1.34"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
web-test = ["httpx>=0.27"]

[project.scripts]
plcagent = "plcagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live infrastructure (postgres/redis/rustfs)",
]
